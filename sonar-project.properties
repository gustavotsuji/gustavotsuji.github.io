# Sonar project configuration (edit placeholders before use)
# See: https://docs.sonarqube.org/latest/analysis/scan/sonarscanner/

# Project identifiers (replace with your real values)
sonar.projectKey=gustavotsuji_github_io
sonar.projectName=gustavotsuji.github.io
# For SonarCloud you will usually set the organization; for self-hosted SonarQube skip it
# sonar.organization=your_org_key

# Provide Sonar host URL (SonarCloud example)
sonar.host.url=https://sonarcloud.io

# Sources and tests
sonar.sources=.
sonar.tests=app,components,lib

# Exclude common artifacts from analysis/coverage mapping
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/coverage/**,**/public/**

# LCOV coverage report paths (Jest output)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Note: Provide SONAR_TOKEN (or sonar.login) in your CI secrets and pass it to the scanner.
