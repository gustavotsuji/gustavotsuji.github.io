name: LHCI Audit

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build site
        run: yarn build
      - name: Export static site (if needed)
        run: |
          if [ -d out ]; then echo "static out exists"; else yarn export || true; fi
      - name: Serve static site and run LHCI
        run: |
          npx http-server ./out -p 3000 &
          PID=$!
          npx wait-on http://localhost:3000
          npx lhci autorun --config=lhci.config.js || true
          kill $PID || true
      - name: Upload LHCI reports
        uses: actions/upload-artifact@v4
        with:
          name: lhci-reports
          path: .lighthouseci/reports
